# Sistem Klasifikasi Kelayakan Siswa (UKS) — static React PWA
# Sementara dilayani di port 8080 sampai DNS subdomain ditambahkan.
server {
    listen 8080;
    listen [::]:8080;

    server_name _;

    root /var/www/uks.app;
    index index.html;

    # Dokumen HTML & service worker tidak boleh di-cache,
    # aset ber-hash (static/) aman di-cache lama.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Jangan sajikan file mentah proyek
    location ~* \.(md|log|sql|env|map)$ {
        deny all;
        return 404;
    }
}
