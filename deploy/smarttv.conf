server {

    # Menggunakan IP publik atau domain
    server_name spensix.web.id;

    # Lokasi folder dist frontend
    root /home/ubuntu/smart-tv/frontend/dist;
    index index.html;

    # Routing Single Page Application (React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Teruskan request /api/ ke Backend Node.js port 5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static upload foto Smart TV dan bukti serah terima
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Aplikasi Klasifikasi Kelayakan Siswa (UKS) — PWA statis
    location = /uks {
        return 301 /uks/;
    }

    location /uks/ {
        alias /var/www/uks.app/;
        index index.html;

        # index.html & service worker jangan di-cache
        location = /uks/index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location = /uks/service-worker.js {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        # aset ber-hash aman di-cache permanen
        location /uks/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # SPA fallback
        try_files $uri $uri/ /uks/index.html;
    }

    # Maksimal ukuran file upload (misal foto fisik TV/bukti)
    client_max_body_size 20M;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/spensix.web.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/spensix.web.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = spensix.web.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name spensix.web.id;
    return 404; # managed by Certbot


}